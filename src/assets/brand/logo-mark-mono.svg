<!-- MONOCHROME variant of logo-mark.svg, generated from it by replacing every
     brand colour with currentColor. The four petals and the wordmark
     become one flat ink; the glyphs inside the petals stay white, so
     they read as cut-outs of whatever colour the caller sets.

